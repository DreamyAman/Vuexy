<body>

                        <h3 class="vx-fs-2 vs-fw-500 mt-2 w-100">Dashboard</h3>
                        <button class="bg-transparent border-0 me-2"><i class="ti ti-caret-right-filled"></i></button>
                    </a>
                </li>
                <li class="vx-fs-2 color-neutral-200 vx-fw-500 my-3">
                    <h3 class="vx-fs-2 vs-fw-500">Apps & Pages</h3>
                </li>
                <li>
                    <a href="#" class="d-flex align-items-center w-100 secondary-btn p-1 active">

                    </a>
                </li>
            </ul>
        </nav>

    </div>

    <article>

    <nav class="d-flex align-items-center w-100 input-box navbar navbar-expand-md g-0">

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="ti ti-menu-2 "></span>
    </button>

        <button type="submit" class="border-0 bg-transparent"><i class="ti ti-search vx-fs-cus-1 me-3"></i></button>
        <div class="collapse navbar-collapse" id="nav">
            <input class="input-box border-0 me-auto" type="text" placeholder="Search [CTRL + K]">
        </div>
        
        
        <ul class="list-unstyled d-flex align-items-center mb-1">
            <li><a href="#"><i class="ti ti-language-hiragana vx-fs-cus-1 rounded-circle nav-icon"></i></a></li>
            <li><a href="#"><i class="ti ti-sun vx-fs-cus-1 rounded-circle nav-icon"></i></a></li>
            <li><a href="#"><i class="ti ti-layout-grid-remove vx-fs-cus-1 rounded-circle nav-icon"></i></a></li>
            <li><a href="#"><i class="ti ti-bell vx-fs-cus-1 rounded-circle nav-icon"></i></a></li>
            <li><a href="#"><img class="rounded-circle" width="39" height="39" src="assets/images/profile.jpg" alt=""></a></li>

    <nav class="d-flex flex-column flex-lg-row mt-3 mt-lg-0">
        <a href="account-form.html" class="accent-btn border-0 vx-fw-500 my-1 my-lg-3 vx-fs-2 d-flex flex-row align-items-center justify-content-center active">
            <i class="ti ti-users me-2"></i>
            Accounts
        </a>
        <a href="security.html" class="accent-btn border-0 vx-fw-500 my-1 my-lg-3 vx-fs-2 d-flex flex-row align-items-center justify-content-center">
            <i class="ti ti-lock me-2"></i>
            Security
        </a>
        <a href="bill&payment.html" class="accent-btn border-0 vx-fw-500 my-1 my-lg-3 vx-fs-2 d-flex flex-row align-items-center justify-content-center">
            <i class="ti ti-bookmark me-2"></i>
            Billing & Plans
        </a>
        <a href="notifications.html" class="accent-btn border-0 vx-fw-500 my-1 my-lg-3 vx-fs-2 d-flex flex-row align-items-center justify-content-center">
            <i class="ti ti-bell me-2"></i>
            Notifications
        </a>
        <a href="connections.html" class="accent-btn border-0 vx-fw-500 my-1 my-lg-3 vx-fs-2 d-flex flex-row align-items-center justify-content-center">
            <i class="ti ti-link me-2"></i>
            Connections
        </a>

        <section>
                
            <form class="container-fluid">
                    
               
                    <div class="row col-12 col-md-6">

                        <div class="d-flex flex-row px-4">

                        <a href="#" class="col-3 me-4 mt-4"><img class="rounded-2" width="100%" src="assets/images/profile.jpg" alt=""></a>
                        <div>
                            <div class="d-flex w-100 col-9 mt-5">
                                <button class="vx-success-btn pt-2 pb-1 px-4 me-2 border-0"><h3 class="vx-fs-2">Upload New Photo</h3></button>
                                <button class="vx-dismiss-btn pt-1 px-4 ms-2 border-0"><h3 class="vx-fs-2">Reset</h3></button>
                            </div>
                                <span class="color-neutral-400"><h3 class="vx-fs-2 vx-fw-400 mt-3">Allowed JPG, GIF or PNG. Max size of 800K</h3></span>
                        </div>

                        </div>

                    </div>
            

                <div class="row d-flex flex-column flex-lg-row">
                    <div class="col-12 col-lg-6 vx-fs-cus py-2 px-4">
                        <label class="mb-1" for="first-name">First Name</label>
                        <input class="input-box w-100 vx-fw-600" type="text" id="first-name" value="Joe" name="first-name">
                    </div>


                    <div class="col-12 col-lg-6 vx-fs-cus py-2 px-4">
                        <label class="mb-1" for="last-name">Last Name</label>
                        <input class="input-box w-100 vx-fw-600" type="text" value="Doe" id="last-name" name="last-name">
                    </div>
                </div>

                

                <div class="row d-flex flex-column flex-lg-row">
                    <div class="col-12 col-lg-6 vx-fs-cus py-2 px-4">
                        <label class="mb-1" for="email">E-mail</label>
                        <input class="input-box w-100 vx-fw-600" type="email" value="john.doe@example.com" id="email" name="email">
                    </div>


                    <div class="col-12 col-lg-6 vx-fs-cus py-2 px-4">
                        <label class="mb-1" for="organization">Organization</label>
                        <input class="input-box w-100 vx-fw-600" type="text" value="pixinvent" id="organization" name="organization">
                    </div>
                </div>



                <div class="row d-flex flex-column flex-lg-row">
                    <div class="col-12 col-lg-6 vx-fs-cus py-2 px-4">
                        <label class="mb-1" for="phoneNo">Phone Number</label>
                        <input class="input-box w-100 vx-fw-600" type="text" placeholder="US(+1) 202 555 011" id="phoneNo" name="phoneNo">
                    </div>


                    <div class="col-12 col-lg-6 vx-fs-cus py-2 px-4">
                        <label class="mb-1" for="address">Address</label>
                        <input class="input-box w-100 vx-fw-600" type="text" placeholder="address" id="address" name="address">
                    </div>
                </div>



                <div class="row d-flex flex-column flex-lg-row">
                    <div class="col-12 col-lg-6 vx-fs-cus py-2 px-4">
                        <label class="mb-1" for="state">State</label>
                        <input class="input-box w-100 vx-fw-600" type="text" placeholder="California" id="state" name="state">
                    </div>


                    <div class="col-12 col-lg-6 vx-fs-cus py-2 px-4">
                        <label class="mb-1" for="zip-code">Zip Code</label>
                        <input class="input-box w-100 vx-fw-600" type="text" placeholder="231465" id="zip-code" name="zip-code">
                    </div>
                </div>



                <div class="row d-flex flex-column flex-lg-row">
                    <div class="col-12 col-lg-6 vx-fs-cus py-2 px-4">
                        <label class="mb-1" for="country">Country</label>
                        <select name="country" class="input-box w-100" id="country">
                            <option value="select" name="select">Select</option>
                            <option value="Brazil" name="Brazil">Brazil</option>
                            <option value="Japan" name="Japan">Japan</option>
                            <option value="Germany" name="Germany">Germany</option>
                            <option value="Canada" name="Canada">Canada</option>
                            <option value="Egypt" name="Egypt">Egypt</option>
                            <option value="Australia" name="Australia">Australia</option>
                            <option value="Argentina" name="Argentina">Argentina</option>
                            <option value="Norway" name="Norway">Norway</option>
                            <option value="Kenya" name="Kenya">Kenya</option>
                            <option value="Thailand" name="Thailand">Thailand</option>
                        </select>
                    </div>


                    <div class="col-12 col-lg-6 vx-fs-cus py-2 px-4">
                        <label class="mb-1" for="lang">Language</label>
                        <select name="country" class="input-box w-100" id="lang">
                            <option value="select">Select Language</option>
                                <option value="select">Select Language</option>
                                <option value="english">English</option>
                                <option value="hindi">Hindi</option>
                                <option value="spanish">Spanish</option>
                                <option value="mandarin">Mandarin</option>
                                <option value="french">French</option>
                                <option value="arabic">Arabic</option>
                                <option value="bengali">Bengali</option>
                                <option value="russian">Russian</option>
                                <option value="portuguese">Portuguese</option>
                                <option value="german">German</option>
                        </select>
                    </div>
                </div>



                <div class="row d-flex flex-column flex-lg-row">
                    <div class="col-12 col-lg-6 vx-fs-cus py-2 px-4">
                        <label class="mb-1" for="timezone">Timezone</label>
                        <select name="country" class="input-box w-100" id="time-zone">
                            <option value="select">Select Timezone</option>
                            <option value="12-hr">12:00</option>
                            <option value="24-hr">24:00</option>
                            <option value="12-hr">12:00</option>
                            <option value="24-hr">24:00</option>
                        </select>
                    </div>

              
                    <div class="col-12 col-lg-6 vx-fs-cus py-2 px-4">
                        <label class="mb-1" for="currency">Currency</label>
                        <select name="country" class="input-box w-100" id="currency">
                            <option value="select">Select Currency</option>
                            <option value="rupees">Rupees</option>
                            <option value="dollar">Dollars</option>
                            <option value="bricks">Bricks</option>
                            <option value="euro">Euro</option>
                            <option value="pound">Pound</option>
                            <option value="yen">Yen</option>
                            <option value="yuan">Yuan</option>
                            <option value="franc">Franc</option>
                            <option value="dinar">Dinar</option>
                            <option value="ruble">Ruble</option>
                        </select>
                    </div>
                
                </div>

                
                <div class="row">
                    <div class="d-flex w-100 col-9 my-3 px-4">
                        <button class="vx-success-btn pt-2 pb-1 px-4 me-2 border-0"><h3 class="vx-fs-2">Save Changes</h3></button>
                        <button class="vx-dismiss-btn pt-1 px-4 ms-2 border-0"><h3 class="vx-fs-2">Cancel</h3></button>
                    </div>
                </div>

            </form>

        </section>
    </article>
    
    </main>

</body>
</html>
